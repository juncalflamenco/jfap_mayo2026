<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Nightfall</title>



    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            font-family: "fira mono";

        }

        .contenedor {
            height: 100vh;
            display: flex;
            flex-direction: column;
         

        }

        header {
            display: flex;
            justify-content: space-around;
            padding: 1.5rem;
           

        }

        nav li,
        main li {
            display: inline-block;
            margin-right: 0.5rem;
        }

        nav a , main a{
            color: black;
            text-decoration: none;

        }

        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;


        }
        h1{
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        footer{
            text-align: center;
            padding: 1.2rem;
        }
        .negro{
        background-color: black;
        color: white;

        }
        main a:hover{
            text-decoration: underline;
        }
    </style>


</head>

<body>
    <div class="contenedor">
    <header class="negro">
        <div class="logo">hello@gohugo.io ~ $</div>
        <nav>
            <ul>
                <li> <a class="negro" href="">~/about</a></li>
                <li> <a class="negro" href="">~/blog</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Hugo Nightfall</h1>
        <ul>
            <li> <a href="">github</a></li>
            <li ><a href=""> twitter</a> </li>
            <li> <a href="">linkedin</a></li>
            <li> <a href="">email</a></li>
        </ul>
    </main>




    <footer class="negro">
        <p>
            &copy;2026 <a href=""></a> Hugo Nightfall, Built with Hugo and Nightfall theme
        </p>
    </footer>
    </div>
</body>

</html>
