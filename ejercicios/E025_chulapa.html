<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Chulapa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
        }

        header {
            height: 100vh;
            width: 100vw;
            background-image: url(https://images.unsplash.com/photo-1545290614-5ceedf604139?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1200&q=60);
            background-position: center;
            background-size: cover;
            overflow: hidden;
        }

        /* Estilos de clase */

        .fondo-gris {
            height: 100%;
            background-color: rgba(185, 66, 66, 0.527);
            text-align: center;
            font-size: 1.5rem;
            color: white;
            padding-top: 40vh;
        }

        .separador {
            width: 5%;
            margin: 15px auto;
            border: 0;
            border-top: 4px solid;
            border-bottom: 12 px;
            color: white;
        }

        h1 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 50px;
            text-shadow: 2px 2px 2px;
        }

        .contenedor {
            width: 70vw;
            margin: 0 auto;
            text-align: center;
        }

        .pastilla {
            margin: 1.2rem auto;
            border-radius: 5px;
            border: 1px solid white;
            padding: 0.2rem 0.5rem;
            width: fit-content;
        }

        .pastilla a {
            font-size: 2rem;
            color: white;
            text-decoration: none;
        }

        .pastilla a:hover {
            color: #090909;

        }
    </style>
</head>

<body>
    <header>
        <div class="fondo-gris">
            <div class="contenedor">
                <h1 class="sombra">Chulapa</h1>
                <hr class="separador">
                <p>A full flexible Jekyll theme for Github Pages</p>
                <div class="pastilla">
                    <a href=""><i class="fa-brands fa-github"></i>Follow </a>


                </div>
            </div>
    </header>

</body>

</html>
