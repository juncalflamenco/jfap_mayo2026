<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación del DOM</title>
    <script>

        function insertar() {
            const contenedor = document.getElementById('contenedor');
            const nuevo = document.createElement('p');
            nuevo.textContent = "Este parrafo ha sido creado dinámicamente"

            contenedor.appendChild(nuevo);
        }

        function nuevo_ejercicio() {
            const lista = document.getElementById('ejercicios');
            for (let i = 0; i < 10; i++) {}
            
                const nuevo = document.createElement('li');
                nuevo.id = "Ej_" + i ;
                nuevo.innerHTML = "Ejercicio " + i + ; 

                const boton = document.createElement('button');
                boton.innerText = "Borrar" ;
                boton.onclick =  function() {borra_elem(nuevo.id)};

                nuevo.appendChild(boton);
                lista.appendChild(nuevo);

            }
        

         function borra_elem(objetivo){
        
            const li = document.getElementById(objetivo);
            const lista = document.getElementById('ejercicios');
            lista.removeChild(li);

         }
    </script>
</head>

<body>
    <h1>Contenedor</h1>
    <div id="contenedor">vacío</div>



    <button onclick="insertar()">
        Nuevo parrafo
    </button>

    <h2>Ejercicios</h2>
    <ul id="ejercicios"></ul>

    <button onclick="nuevo_ejercicio()">
        Nuevo ejercicio
    </button>
 
</body>

</html>
